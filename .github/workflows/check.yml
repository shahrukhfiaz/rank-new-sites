name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated skill and catalog match PLAYBOOK.md and the CSV
        run: node scripts/build.mjs --check
